# Konstellation block explorer — Blockscout (ENGINEERING.md §6.5).
#
# One compose file serves every network; the network is picked by the env file:
#
#   docker compose --env-file .env.local up -d            # dev chain, 56670
#   docker compose --env-file .env.testnet-1 up -d        # testnet-1, 56671
#   docker compose --env-file .env.konstellation-1 up -d  # mainnet, 5667
#
# Layout mirrors upstream blockscout/blockscout `docker-compose/` (backend,
# frontend, postgres, redis, stats, smart-contract-verifier, user-ops-indexer,
# nft-media-handler, nginx proxy) with the per-service upstream
# `envs/common-*.env` files kept under envs/. Values that differ per network
# live only in the .env.<net> file and are interpolated below.
#
# Images are pinned to a tag AND a digest (ENGINEERING.md §2.3 — never a
# branch, never `latest`). Bump them deliberately: change the tag, re-resolve
# the digest with `docker buildx imagetools inspect <image:tag>`, and record it
# in the commit message.
#
# The backend refuses to start unless `rpc-preflight` passed: the target must
# be an archive node with the debug namespace (§5.2, §6.5). See
# scripts/check-rpc.sh. Note that `service_completed_successfully` is checked
# by `docker compose up` only — a container restart (crash, `restart: always`
# after a reboot) does not re-run the preflight. Re-run `up` after changing
# the RPC target.
#
# Profiles (COMPOSE_PROFILES in .env.<net>):
#   nft-media  the NFT media worker; needs an HTTPS S3 bucket (NFT_MEDIA_S3_*)
#   local-s3   a MinIO stand-in for that bucket — dev chain only

name: konstellation-explorer

x-host-gateway: &host-gateway
  # Linux needs this to resolve host.docker.internal; Docker Desktop
  # (macOS/Windows) provides it anyway.
  extra_hosts:
    - "host.docker.internal:host-gateway"

# Every service: rotate the json-file logs. The media worker alone writes
# ~10 lines/s of `{:badrpc, :nodedown}` while the backend is down.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# NFT media: the backend (Erlang node "producer") queues token-instance media
# URLs; the nft-media-handler container (Erlang node "worker", same image)
# fetches, resizes (60/250/500 px, hardcoded upstream) and uploads them to an
# S3-compatible bucket over HTTPS, then hands the result back over Erlang
# distribution. Distribution (EPMD 4369 + one dist port; the cookie is remote
# code execution) is confined to the `erlang` network below — internal, fixed
# IPs so node names are stable, only backend and worker attached — and both
# nodes bind EPMD and the dist listener to their IP on that network
# (ERL_EPMD_ADDRESS, inet_dist_use_interface), so nothing on the default
# network, where the internet-facing proxy and frontend live, can reach them.
# Never attach this stack to a platform-shared network.
#
# The bucket is real object storage on testnet-1/mainnet (NFT_MEDIA_S3_* in
# .env.<net>); locally the `local-s3` profile runs MinIO behind a self-signed
# cert (README "NFT media"). With NFT_MEDIA_ENABLED=false the S3 values are
# not required, the `nft-media` profile stays off and the backend runs
# without distribution (RELEASE_DISTRIBUTION=none).
x-nft-media-common: &nft-media-common
  NFT_MEDIA_HANDLER_ENABLED: ${NFT_MEDIA_ENABLED:-false}
  NFT_MEDIA_HANDLER_REMOTE_DISPATCHER_NODE_MODE_ENABLED: "true"
  IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-https://ipfs.io/ipfs}
  IPFS_PUBLIC_GATEWAY_URL: ${IPFS_PUBLIC_GATEWAY_URL:-https://ipfs.io/ipfs}
  RELEASE_COOKIE: ${RELEASE_COOKIE:-}

# ELIXIR_ERL_OPTIONS: the `-kernel` flags pin the distribution listener to the
# node's erlang-network IP and a single port (9100, no dynamic range).
# NFT_MEDIA_S3_ERL_OPTIONS is empty on real networks; locally it carries
# `-ex_aws hackney_opts [insecure,...]` so the worker's S3 client accepts
# MinIO's self-signed cert (the release hardcodes https:// for the bucket and
# hackney verifies against certifi's compiled-in CA list, so that hackney
# option — which nothing in runtime.exs sets — is the only knob).

# Networks — least reach between containers:
#   default   egress + the internet-facing proxy/frontend; also where the
#             backend, stats and user-ops-indexer talk to each other
#   data      internal: postgres ×2 and redis, reachable only by backend,
#             stats and user-ops-indexer — not by the proxy, frontend, the
#             media worker (SSRF surface) or the verifier (compiles
#             untrusted input)
#   verifier  the backend and the verifier alone; not internal because the
#             verifier downloads compiler binaries. Nothing else can reach
#             its unauthenticated API.
#   erlang    internal: backend + media worker distribution (see above)
networks:
  default: {}
  data:
    internal: true
  verifier: {}
  erlang:
    internal: true
    ipam:
      config:
        - subnet: ${ERLANG_SUBNET:-10.56.67.0/24}

# Per-service ceilings so one runaway (a compile bomb in the verifier, a
# media fetch, a BEAM leak) cannot take the host down with it. Compose
# applies deploy.resources.limits without swarm.
x-limits-large: &limits-large
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 4g
        pids: 2048
x-limits-medium: &limits-medium
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 1g
        pids: 512
x-limits-small: &limits-small
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512m
        pids: 256

services:
  # ---------------------------------------------------------------- preflight
  rpc-preflight:
    image: curlimages/curl:8.14.1@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
    <<: [*host-gateway, *logging]
    restart: "no"
    environment:
      RPC_HTTP_URL: ${RPC_HTTP_URL:?set in .env.<net>}
      RPC_TRACE_URL: ${RPC_TRACE_URL:-${RPC_HTTP_URL}}
      RPC_WS_URL: ${RPC_WS_URL:?set in .env.<net>}
      CHAIN_ID: ${CHAIN_ID:?set in .env.<net>}
    volumes:
      - ./scripts/check-rpc.sh:/check-rpc.sh:ro
    entrypoint: ["sh", "/check-rpc.sh"]

  # ---------------------------------------------------------------- datastores
  redis-db:
    image: redis:7.4-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    <<: [*logging, *limits-small]
    restart: always
    networks: [data]
    # password-protected even on the internal network: it holds the
    # rate-limit buckets and account cache, and anything that reaches it
    # can flush or rewrite them
    command: redis-server --save "" --appendonly no --requirepass "${REDIS_PASSWORD:?set in .env.<net>}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    <<: *logging
    restart: always
    networks: [data]
    shm_size: 256m
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      # goes into URLs unescaped (DATABASE_URL etc.): hex only, see .env.<net>
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.<net>}
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stats-db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    <<: *logging
    restart: always
    networks: [data]
    shm_size: 256m
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: ${STATS_POSTGRES_PASSWORD:?set in .env.<net>}
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------- backend
  backend:
    # Newest tag published to the PUBLIC registry as of 2026-09-20. Blockscout
    # v10/v11 release images only exist in ghcr.io/blockscout/blockscout-private
    # (upstream `public-release.yml` is a manual copy that has not run since
    # 9.0.2); see README "Versions" before bumping.
    image: ghcr.io/blockscout/blockscout:9.0.2@sha256:7659f168e4e2f6b73dd559ae5278fe96ba67bc2905ea01b57a814c68adf5a9dc
    <<: [*host-gateway, *logging, *limits-large]
    restart: always
    stop_grace_period: 5m
    depends_on:
      rpc-preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    networks:
      default: {}
      data: {}
      verifier: {}
      erlang:
        ipv4_address: ${BACKEND_IP:-10.56.67.10}
    # `rm -f dets/tasks_in_progress`: Blockscout 9.0.2 persists the NFT
    # media "in progress" table to disk and never expires its entries (the
    # timestamps are VM-monotonic), so any media URL that was mid-fetch when
    # the backend stopped is stuck forever after a restart — reproduced
    # 2026-09-20 (Indexer.NFTMediaHandler.Queue). Dropping the table at start
    # is safe: the backfiller re-queues every instance without thumbnails.
    # dets/queue_storage (the pending queue) is kept.
    command: sh -c "rm -f dets/tasks_in_progress; bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && exec bin/blockscout start"
    env_file:
      - envs/backend.common.env
      - envs/nft-media.common.env
    environment:
      <<: *nft-media-common
      NFT_MEDIA_HANDLER_IS_WORKER: "false"
      NFT_MEDIA_HANDLER_AWS_ACCESS_KEY_ID: ${NFT_MEDIA_S3_ACCESS_KEY_ID:-}
      NFT_MEDIA_HANDLER_AWS_SECRET_ACCESS_KEY: ${NFT_MEDIA_S3_SECRET_ACCESS_KEY:-}
      NFT_MEDIA_HANDLER_AWS_BUCKET_HOST: ${NFT_MEDIA_S3_HOST:-}
      NFT_MEDIA_HANDLER_AWS_BUCKET_NAME: ${NFT_MEDIA_S3_BUCKET:-}
      NFT_MEDIA_HANDLER_AWS_PUBLIC_BUCKET_URL: ${NFT_MEDIA_S3_PUBLIC_URL:-}
      # Erlang distribution: `none` unless NFT media is on (.env.<net>)
      RELEASE_DISTRIBUTION: ${RELEASE_DISTRIBUTION:-none}
      RELEASE_NODE: producer@${BACKEND_IP:-10.56.67.10}
      ERL_EPMD_ADDRESS: ${BACKEND_IP:-10.56.67.10}
      ELIXIR_ERL_OPTIONS: -kernel inet_dist_use_interface ${BACKEND_IP_TUPLE:-{10,56,67,10}} -kernel inet_dist_listen_min 9100 -kernel inet_dist_listen_max 9100 ${NFT_MEDIA_S3_ERL_OPTIONS:-}
      # --- network (from .env.<net>) ---
      CHAIN_ID: ${CHAIN_ID}
      NETWORK: Konstellation
      SUBNETWORK: ${NETWORK_DISPLAY_NAME:?set in .env.<net>}
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: ${RPC_HTTP_URL}
      ETHEREUM_JSONRPC_TRACE_URL: ${RPC_TRACE_URL:-${RPC_HTTP_URL}}
      ETHEREUM_JSONRPC_WS_URL: ${RPC_WS_URL}
      # public origin: used for sitemap.xml and absolute links
      BLOCKSCOUT_HOST: ${EXPLORER_HOST:?set in .env.<net>}
      BLOCKSCOUT_PROTOCOL: ${EXPLORER_PROTOCOL:?set in .env.<net>}
      # --- secrets (from .env.<net>) ---
      DATABASE_URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in .env.<net>}
      # --- microservices in this stack ---
      MICROSERVICE_SC_VERIFIER_ENABLED: "true"
      MICROSERVICE_SC_VERIFIER_URL: http://smart-contract-verifier:8050/
      MICROSERVICE_SC_VERIFIER_TYPE: sc_verifier
      MICROSERVICE_ACCOUNT_ABSTRACTION_ENABLED: "true"
      MICROSERVICE_ACCOUNT_ABSTRACTION_URL: http://user-ops-indexer:8050/
      ACCOUNT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis-db:6379
      # rate-limit buckets shared through redis (and per client IP — the
      # proxy's XFF is honoured; envs/backend.common.env)
      API_RATE_LIMIT_HAMMER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis-db:6379
    volumes:
      - backend-logs:/app/logs
      - backend-dets:/app/dets

  # ---------------------------------------------------------------- NFT media
  nft-media-handler:
    # Same image as the backend, started as a standalone media worker.
    # Its outbound fetches (arbitrary token-metadata hosts) originate inside
    # our network — an SSRF class inherited from upstream. The backend's
    # metadata host filter (INDEXER_TOKEN_INSTANCE_HOST_FILTERING_ENABLED,
    # envs/backend.common.env) is the primary control; this container is
    # also kept off the data and verifier networks, and the erlang network
    # is internal. See README "NFT media" for the egress policy.
    profiles: ["nft-media"]
    image: ghcr.io/blockscout/blockscout:9.0.2@sha256:7659f168e4e2f6b73dd559ae5278fe96ba67bc2905ea01b57a814c68adf5a9dc
    <<: [*logging, *limits-medium]
    restart: always
    stop_grace_period: 1m
    depends_on:
      backend:
        condition: service_started
    networks:
      default: {}
      erlang:
        ipv4_address: ${NFT_MEDIA_HANDLER_IP:-10.56.67.11}
    command: bin/blockscout start
    env_file:
      - envs/nft-media.common.env
    environment:
      <<: *nft-media-common
      NFT_MEDIA_HANDLER_ENABLED: "true"
      NFT_MEDIA_HANDLER_IS_WORKER: "true"
      NFT_MEDIA_HANDLER_AWS_ACCESS_KEY_ID: ${NFT_MEDIA_S3_ACCESS_KEY_ID:?set in .env.<net> when the nft-media profile is on}
      NFT_MEDIA_HANDLER_AWS_SECRET_ACCESS_KEY: ${NFT_MEDIA_S3_SECRET_ACCESS_KEY:?set in .env.<net> when the nft-media profile is on}
      NFT_MEDIA_HANDLER_AWS_BUCKET_HOST: ${NFT_MEDIA_S3_HOST:?set in .env.<net> when the nft-media profile is on}
      NFT_MEDIA_HANDLER_AWS_BUCKET_NAME: ${NFT_MEDIA_S3_BUCKET:?set in .env.<net> when the nft-media profile is on}
      NFT_MEDIA_HANDLER_AWS_PUBLIC_BUCKET_URL: ${NFT_MEDIA_S3_PUBLIC_URL:?set in .env.<net> when the nft-media profile is on}
      # producer node -> folder inside the bucket where this network's media goes
      NFT_MEDIA_HANDLER_NODES_MAP: '{"producer@${BACKEND_IP:-10.56.67.10}": "/${NFT_MEDIA_S3_FOLDER:?set in .env.<net> when the nft-media profile is on}"}'
      RELEASE_DISTRIBUTION: name
      RELEASE_COOKIE: ${RELEASE_COOKIE:?set in .env.<net> when the nft-media profile is on}
      RELEASE_NODE: worker@${NFT_MEDIA_HANDLER_IP:-10.56.67.11}
      ERL_EPMD_ADDRESS: ${NFT_MEDIA_HANDLER_IP:-10.56.67.11}
      ELIXIR_ERL_OPTIONS: -kernel inet_dist_use_interface ${NFT_MEDIA_HANDLER_IP_TUPLE:-{10,56,67,11}} -kernel inet_dist_listen_min 9100 -kernel inet_dist_listen_max 9100 ${NFT_MEDIA_S3_ERL_OPTIONS:-}

  # ---------------------------------------------------------------- frontend
  frontend:
    # Newest public tag (see backend note); v2.4+ ship only to the private registry.
    image: ghcr.io/blockscout/frontend:v2.3.5@sha256:4b69f44148414b55c6b8550bc3270c63c9f99e923d54ef0b307e762af6bac90a
    <<: [*logging, *limits-medium]
    restart: always
    depends_on:
      - backend
    env_file:
      - envs/frontend.common.env
    # list form: NEXT_PUBLIC_*_PORT are passed through from .env.<net> by
    # name and OMITTED when unset there. The image's env validator refuses an
    # empty port ("must be a number") and exits, and a set port is echoed into
    # every absolute URL the app builds (`https://host:443/...`), so behind
    # the TLS ingress the right value is no value at all.
    environment:
      - NEXT_PUBLIC_NETWORK_ID=${CHAIN_ID}
      - NEXT_PUBLIC_NETWORK_NAME=${NETWORK_DISPLAY_NAME}
      - NEXT_PUBLIC_NETWORK_SHORT_NAME=Konstellation
      - NEXT_PUBLIC_NETWORK_RPC_URL=${PUBLIC_RPC_URL:?set in .env.<net>}
      - NEXT_PUBLIC_IS_TESTNET=${IS_TESTNET:?set in .env.<net>}
      # Where the browser reaches this stack (the nginx proxy below).
      - NEXT_PUBLIC_API_HOST=${EXPLORER_HOST}
      - NEXT_PUBLIC_API_PORT
      - NEXT_PUBLIC_API_PROTOCOL=${EXPLORER_PROTOCOL}
      - NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL=${EXPLORER_WS_PROTOCOL:?set in .env.<net>}
      - NEXT_PUBLIC_APP_HOST=${EXPLORER_HOST}
      - NEXT_PUBLIC_APP_PORT
      - NEXT_PUBLIC_APP_PROTOCOL=${EXPLORER_PROTOCOL}
      - NEXT_PUBLIC_STATS_API_HOST=${STATS_PUBLIC_URL:?set in .env.<net>}
      # branding/ is served by the proxy at /branding/ (see nginx/default.conf.template)
      - NEXT_PUBLIC_NETWORK_LOGO=${EXPLORER_PUBLIC_URL:?set in .env.<net>}/branding/logo.svg
      - NEXT_PUBLIC_NETWORK_LOGO_DARK=${EXPLORER_PUBLIC_URL}/branding/logo-dark.svg
      - NEXT_PUBLIC_NETWORK_ICON=${EXPLORER_PUBLIC_URL}/branding/icon.svg

  # ---------------------------------------------------------------- stats
  stats:
    image: ghcr.io/blockscout/stats:v2.19.1@sha256:a618847070aa0d8256b99082de882f6c5fca7cd20721e04511ee0e1bb5d0b6b5
    <<: [*logging, *limits-medium]
    restart: always
    networks: [default, data]
    depends_on:
      stats-db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - envs/stats.common.env
    environment:
      STATS__DB_URL: postgres://stats:${STATS_POSTGRES_PASSWORD}@stats-db:5432/stats
      STATS__BLOCKSCOUT_DB_URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      STATS__BLOCKSCOUT_API_URL: http://backend:4000
      STATS__CREATE_DATABASE: "true"
      STATS__RUN_MIGRATIONS: "true"

  # ---------------------------------------------------------------- verifier
  verifier-init:
    # The verifier image runs as uid 1001 (`app`) but a fresh named volume is
    # created root:root 0755, so every compiler download failed with
    # PermissionDenied (seen 2026-09-20 verifying WKASH). Same fix upstream
    # applies to postgres (db-init): chown the volumes before the service
    # starts. Idempotent; runs on every `up`.
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    <<: *logging
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1001:1001 /compilers/solidity /compilers/vyper && ls -ld /compilers/*"]
    volumes:
      - verifier-compilers:/compilers/solidity
      - verifier-vyper-compilers:/compilers/vyper

  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier:v1.10.7@sha256:0b82d1e2f57354b5aa785b33cc82d24a1d2e2d5838dce6adcb81e8bc144c1724
    <<: [*logging, *limits-large]
    # only the backend talks to it; it compiles user-supplied sources
    networks: [verifier]
    # amd64 on every host, as upstream does: the solc binaries it downloads
    # (SOLC_LIST_URL) are linux-amd64, and an x86 solc inside a native arm64
    # container dies with "rosetta error: failed to open elf at
    # /lib64/ld-linux-x86-64.so.2" (seen 2026-09-20 on Apple Silicon). Under
    # emulation the whole container is x86 and solc runs. Native arm64 hosts
    # can instead drop this line and set SOLC_LIST_URL to blockscout's
    # solc.aarch64.list.json (envs/smart-contract-verifier.common.env).
    platform: linux/amd64
    restart: always
    depends_on:
      verifier-init:
        condition: service_completed_successfully
    env_file:
      - envs/smart-contract-verifier.common.env
    environment:
      SMART_CONTRACT_VERIFIER__SOLIDITY__FETCHER__LIST__LIST_URL: ${SOLC_LIST_URL:-https://binaries.soliditylang.org/linux-amd64/list.json}
    volumes:
      - verifier-compilers:/tmp/solidity-compilers
      - verifier-vyper-compilers:/tmp/vyper-compilers

  # ---------------------------------------------------------------- ERC-4337
  user-ops-indexer:
    # Indexes UserOperations through the preinstalled EntryPoints (ENGINEERING.md
    # §6.3: v0.7 + v0.8 at their canonical addresses; no v0.6 on Konstellation).
    image: ghcr.io/blockscout/user-ops-indexer:v1.4.3@sha256:d0ffe9c672d9c5cf1e035b2dd8e4baf9e9b28d3382822ea2d07e69a924562932
    <<: [*host-gateway, *logging, *limits-small]
    restart: always
    networks: [default, data]
    depends_on:
      rpc-preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - envs/user-ops-indexer.common.env
    environment:
      USER_OPS_INDEXER__INDEXER__RPC_URL: ${RPC_WS_URL}
      USER_OPS_INDEXER__DATABASE__CONNECT__URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      USER_OPS_INDEXER__DATABASE__RUN_MIGRATIONS: "true"

  # ---------------------------------------------------------------- proxy
  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    <<: *logging
    restart: always
    depends_on:
      - backend
      - frontend
      - stats
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - ./branding:/usr/share/nginx/branding:ro
    environment:
      BACK_PROXY_PASS: http://backend:4000
      FRONT_PROXY_PASS: http://frontend:3000
      STATS_PROXY_PASS: http://stats:8050
      CORS_ORIGIN: ${EXPLORER_PUBLIC_URL}
      # CIDR the TLS ingress connects from; its X-Forwarded-For is trusted,
      # everyone else's is replaced (nginx/default.conf.template). Empty =
      # no ingress = nobody is trusted ("0.0.0.0/32" matches nothing).
      TRUSTED_INGRESS_CIDR: ${TRUSTED_INGRESS_CIDR:-0.0.0.0/32}
    # Published on loopback only: the TLS ingress on the same host is what
    # the internet talks to, and Docker's published ports bypass ufw/nftables
    # INPUT rules. EXPLORER_BIND=0.0.0.0 only if the ingress is elsewhere.
    ports:
      - target: 80
        published: ${EXPLORER_PORT:-80}
        host_ip: ${EXPLORER_BIND:-127.0.0.1}
      - target: 8080
        published: ${STATS_PORT:-8080}
        host_ip: ${EXPLORER_BIND:-127.0.0.1}

  # ---------------------------------------------------------------- local S3
  # `local-s3` profile (.env.local): an S3 stand-in so NFT media can be tested
  # on the dev chain. Not for any real network.
  local-s3-certs:
    profiles: ["local-s3"]
    image: alpine/openssl:3.5.4@sha256:42c7389ef077aed0eb4e96d0abbd094083d701bbaff1313073b061c0c9cd8278
    <<: *logging
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e; cd /certs
        if [ ! -f public.crt ]; then
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 3650 \
            -keyout ca.key -out ca.crt -subj "/CN=konstellation-explorer local S3 CA"
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout private.key -out minio.csr -subj "/CN=minio"
          printf 'subjectAltName=DNS:minio,DNS:localhost\n' > san.cnf
          openssl x509 -req -in minio.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 3650 \
            -out public.crt -extfile san.cnf
          chmod 0644 ca.crt public.crt; chmod 0644 private.key
        fi
        ls -l /certs
    volumes:
      - local-s3-certs:/certs

  minio:
    profiles: ["local-s3"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    <<: *logging
    restart: always
    depends_on:
      local-s3-certs:
        condition: service_completed_successfully
    # https on 443: the backend's S3 client is hardcoded to https and port 443
    command: server /data --address ":443" --certs-dir /certs --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NFT_MEDIA_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${NFT_MEDIA_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - local-s3-data:/data
      - local-s3-certs:/certs:ro

  local-s3-init:
    profiles: ["local-s3"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    <<: *logging
    restart: "no"
    depends_on:
      - minio
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        until mc --insecure alias set local https://minio:443 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 2; done
        mc --insecure mb --ignore-existing "local/$$BUCKET"
        mc --insecure anonymous set download "local/$$BUCKET"
        echo "bucket $$BUCKET ready, anonymous read"
    environment:
      MINIO_ROOT_USER: ${NFT_MEDIA_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${NFT_MEDIA_S3_SECRET_ACCESS_KEY:-}
      BUCKET: ${NFT_MEDIA_S3_BUCKET:-}

  local-s3-proxy:
    # Plain-http front for the browser (it would refuse MinIO's self-signed
    # cert); NFT_MEDIA_S3_PUBLIC_URL in .env.local points here.
    profiles: ["local-s3"]
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    <<: *logging
    restart: always
    depends_on:
      - minio
    volumes:
      - ./nginx/local-s3:/etc/nginx/templates:ro
    ports:
      - target: 8082
        published: ${LOCAL_S3_PUBLIC_PORT:-3082}
        host_ip: ${EXPLORER_BIND:-127.0.0.1}

volumes:
  local-s3-certs:
  local-s3-data:
  blockscout-db-data:
  stats-db-data:
  backend-logs:
  backend-dets:
  verifier-compilers:
  verifier-vyper-compilers:
